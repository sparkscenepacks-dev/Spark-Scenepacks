<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Content - Spark Scenepacks</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(255, 255, 255, 0.03);
            --input-bg: rgba(255, 255, 255, 0.05);
            --accent-white: #ffffff;
            --text-grey: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --purple-glow: rgba(123, 97, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--bg-color);
            background-image: radial-gradient(circle at 50% -20%, var(--purple-glow), transparent 40%),
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.95)),
                url('assets/Blackhole.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--accent-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Navigation Style (Consistent with index.html) */
        .nav {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 1200px;
            padding: 8px 24px;
            z-index: 2000;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 100px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 32px;
            filter: invert(1);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link:hover {
            color: #fff;
        }

        /* Request Form Styles */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
        }

        .request-card {
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 560px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .request-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .request-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .request-subtitle {
            color: var(--text-grey);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-grey);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input, .select, .textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input:focus, .select:focus, .textarea:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05);
        }

        .select option {
            background: #111;
            color: #fff;
        }

        .textarea {
            height: 120px;
            resize: none;
        }

        .submit-btn {
            width: 100%;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 32px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.9);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Success Message Overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            z-index: 3000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .success-icon {
            font-size: 5rem;
            color: #43b883;
            margin-bottom: 24px;
            animation: scaleIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* Custom Notification */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 16px 24px;
            border-radius: 16px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 4000;
            animation: slideInRight 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>

<body>
    <nav class="nav">
        <a href="index.html" class="logo">
            <img src="assets/Spark Logo No Bg Cropped.png" alt="Spark Logo">
        </a>
        <div class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="donate.html" class="nav-link">Donate</a>
            <a href="auth.html" class="nav-link" id="navLoginBtn">Login</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="request-card">
            <div class="request-header">
                <h1 class="request-title">Request Content</h1>
                <p class="request-subtitle">Can't find what you're looking for? Let us know and we'll try to add it to the platform.</p>
            </div>

            <form id="requestForm">
                <div class="form-group">
                    <label class="label">Request Type</label>
                    <select class="select" id="requestType" required>
                        <option value="" disabled selected>Select Type</option>
                        <option value="scenepack">Scenepack</option>
                        <option value="preset">Preset (FF, CC, etc.)</option>
                        <option value="resource">Resource (SFX, Overlay, etc.)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="label">Title / Subject</label>
                    <input type="text" class="input" id="requestTitle" placeholder="e.g. Stranger Things S4 Max Scenepack" required>
                </div>

                <div class="form-group">
                    <label class="label">Details / Reference Link</label>
                    <textarea class="textarea" id="requestDetails" placeholder="Add any specific details or a YouTube/Tiktok link for reference..." required></textarea>
                </div>

                <div class="form-group" id="emailGroup">
                    <label class="label">Your Email</label>
                    <input type="email" class="input" id="requestEmail" placeholder="To notify you once it's added" required>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Submit Request <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <div class="success-overlay" id="successOverlay">
        <i class="fas fa-check-circle success-icon"></i>
        <h2 class="request-title">Request Submitted!</h2>
        <p class="request-subtitle" style="margin-bottom: 32px;">We've received your request. Our team will look into it soon.</p>
        <button class="submit-btn" style="max-width: 200px;" onclick="window.location.href='index.html'">Back to Home</button>
    </div>

    <div class="notification" id="notification">
        <i class="fas fa-info-circle"></i>
        <span id="notificationText"></span>
    </div>

    <script>
        const API_BASE = window.location.origin === 'http://127.0.0.1:5500' ? 'http://localhost:5000' : '';

        // Auto-fill email if user is logged in
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('spark_user'));
            if (user) {
                const emailInput = document.getElementById('requestEmail');
                if (user.email) {
                    emailInput.value = user.email;
                    document.getElementById('emailGroup').style.display = 'none';
                }
                document.getElementById('navLoginBtn').style.display = 'none';
            }
        });

        const requestForm = document.getElementById('requestForm');
        const submitBtn = document.getElementById('submitBtn');
        const successOverlay = document.getElementById('successOverlay');

        requestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

            const requestData = {
                type: document.getElementById('requestType').value,
                title: document.getElementById('requestTitle').value,
                description: document.getElementById('requestDetails').value,
                email: document.getElementById('requestEmail').value,
                timestamp: new Date().toISOString()
            };

            try {
                // In a real app, this would be an API call to our server.js
                // For now, we'll implement the backend endpoint in server.js next
                const response = await fetch(`${API_BASE}/api/requests`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                if (response.ok) {
                    successOverlay.style.display = 'flex';
                } else {
                    const err = await response.json();
                    showNotification(err.error || 'Failed to submit request. Please try again.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Submit Request <i class="fas fa-paper-plane"></i>';
                }
            } catch (error) {
                console.error('Request Submission Error:', error);
                // Fallback for local dev if server is not running
                showNotification('Connection Error. Please check if the server is running.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Submit Request <i class="fas fa-paper-plane"></i>';
            }
        });

        function showNotification(text) {
            const notification = document.getElementById('notification');
            const notificationText = document.getElementById('notificationText');
            notificationText.textContent = text;
            notification.style.display = 'flex';
            setTimeout(() => {
                notification.style.display = 'none';
            }, 5000);
        }
    </script>
</body>

</html>
